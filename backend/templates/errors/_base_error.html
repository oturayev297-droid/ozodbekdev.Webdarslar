<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Xatolik{% endblock %} | Nexus</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            background:#030712;color:#e2e8f0;padding:2rem;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
        }
        .card{max-width:34rem;text-align:center}
        .code{
            font-size:clamp(5rem,18vw,9rem);font-weight:900;line-height:1;
            letter-spacing:-.05em;
            background:linear-gradient(135deg,#0ea5e9,#6366f1);
            -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        h1{font-size:1.5rem;font-weight:800;margin:1rem 0 .75rem}
        p{color:#94a3b8;line-height:1.7;margin-bottom:2rem}
        a{
            display:inline-block;padding:.85rem 2rem;border-radius:.875rem;
            background:#0ea5e9;color:#fff;text-decoration:none;font-weight:700;
            font-size:.875rem;transition:transform .15s,background .15s;
        }
        a:hover{background:#0284c7;transform:translateY(-2px)}
    </style>
</head>
<body>
    <div class="card">
        <div class="code">{% block code %}500{% endblock %}</div>
        <h1>{% block heading %}Xatolik yuz berdi{% endblock %}</h1>
        <p>{% block message %}Nimadir noto'g'ri ketdi.{% endblock %}</p>
        <a href="/">Bosh sahifaga qaytish</a>
    </div>
</body>
</html>
