<!DOCTYPE html>
<html class="dark" lang="uz">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}Obuna{% endblock %} | Nexus</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: {
                primary: "#0ea5e9", secondary: "#2dd4bf",
                background: "#020617", surface: "#0f172a",
            } } }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .grid-bg {
            background-image:
                linear-gradient(rgba(14,165,233,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14,165,233,.05) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at 50% 0%, black, transparent 75%);
        }
    </style>
</head>
<body class="bg-background text-slate-100 min-h-screen">
    <div class="fixed inset-0 grid-bg pointer-events-none z-0"></div>

    <!-- Navigatsiya -->
    <nav class="h-16 md:h-20 glass border-b border-white/5 flex items-center justify-between px-4 md:px-10 sticky top-0 z-50">
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 group">
            <div class="w-9 h-9 md:w-10 md:h-10 bg-gradient-to-tr from-primary to-secondary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 group-hover:rotate-12 transition-transform">
                <span class="material-icons-round text-white text-lg">terminal</span>
            </div>
            <span class="text-base md:text-lg font-black tracking-tighter text-white uppercase italic">Ozodbek.web</span>
        </a>
        <div class="flex items-center gap-3 md:gap-6">
            <a href="{% url 'lessons' %}" class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-white transition-colors">Darslar</a>
            <a href="{% url 'billing:history' %}" class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-white transition-colors">Tarix</a>
            <a href="{% url 'dashboard' %}" class="text-[10px] md:text-xs font-bold uppercase tracking-widest text-primary hover:text-white transition-colors">Kabinet</a>
        </div>
    </nav>

    <main class="relative z-10 max-w-5xl mx-auto px-4 md:px-8 py-8 md:py-16">
        {% if messages %}
        <div class="space-y-3 mb-8">
            {% for message in messages %}
            <div class="p-4 rounded-2xl text-xs md:text-sm font-bold flex items-start gap-3
                        {% if message.tags == 'error' %}bg-red-500/10 border border-red-500/20 text-red-400
                        {% elif message.tags == 'success' %}bg-emerald-500/10 border border-emerald-500/20 text-emerald-400
                        {% else %}bg-primary/10 border border-primary/20 text-primary{% endif %}">
                <span class="material-icons-round text-base shrink-0">
                    {% if message.tags == 'error' %}error_outline{% elif message.tags == 'success' %}check_circle{% else %}info{% endif %}
                </span>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
