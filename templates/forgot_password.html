<!DOCTYPE html>
<html class="dark" lang="uz">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Parolni tiklash | Nexus</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: {
            primary: "#0ea5e9", secondary: "#2dd4bf", background: "#020617", surface: "#0f172a",
        } } } }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; }
        .glass { background: rgba(15,23,42,.4); backdrop-filter: blur(40px) saturate(200%); border: 1px solid rgba(255,255,255,.05); }
        .input-nexus { background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.05); transition: all .4s cubic-bezier(.16,1,.3,1); }
        .input-nexus:focus { background: rgba(14,165,233,.05); border-color: #0ea5e9; box-shadow: 0 0 30px rgba(14,165,233,.1); }
        .glow { filter: blur(120px); opacity: .2; }
    </style>
</head>
<body class="bg-background text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-8">
    <div class="absolute top-1/3 left-1/4 w-[300px] h-[300px] md:w-[500px] md:h-[500px] bg-primary rounded-full glow pointer-events-none"></div>

    <div class="w-full max-w-md glass rounded-[2rem] md:rounded-[2.5rem] p-6 sm:p-10 space-y-8 relative z-10">
        <div class="text-center space-y-4">
            <div class="w-14 h-14 mx-auto bg-gradient-to-tr from-primary to-secondary rounded-2xl flex items-center justify-center shadow-xl shadow-primary/20">
                <span class="material-icons-round text-white text-2xl">lock_reset</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-black text-white tracking-tighter italic">Parolni tiklash</h1>
            <p class="text-[11px] md:text-xs text-slate-400 leading-relaxed">
                Ro'yxatdan o'tgan emailingizni kiriting — 6 xonali tiklash kodi yuboramiz.
            </p>
        </div>

        {% if messages %}
        <div class="space-y-3">
            {% for message in messages %}
            <div class="p-4 rounded-2xl text-[11px] font-bold leading-relaxed
                        {% if message.tags == 'error' %}bg-red-500/10 border border-red-500/20 text-red-400
                        {% else %}bg-emerald-500/10 border border-emerald-500/20 text-emerald-400{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form action="{% url 'forgot_password' %}" method="post" class="space-y-6">
            {% csrf_token %}
            <div class="space-y-3">
                <label class="text-[9px] font-black text-slate-500 uppercase tracking-[0.3em] block">Email</label>
                <input type="email" name="email" required autofocus autocomplete="email"
                       placeholder="siz@example.com"
                       class="w-full input-nexus px-5 py-4 rounded-2xl outline-none text-white text-sm font-bold placeholder:text-slate-700"/>
            </div>

            <button type="submit"
                    class="w-full py-4 md:py-5 bg-primary text-white rounded-2xl font-black uppercase tracking-[0.25em] text-[10px] md:text-xs hover:bg-primary/90 hover:-translate-y-0.5 active:translate-y-0 transition-all shadow-2xl shadow-primary/25">
                Kod yuborish
            </button>
        </form>

        <div class="flex items-center justify-between text-[10px] font-black uppercase tracking-widest">
            <a href="{% url 'login' %}" class="text-slate-500 hover:text-white transition-colors">Kirishga qaytish</a>
            <a href="{% url 'reset_password' %}" class="text-primary hover:underline">Kodim bor</a>
        </div>
    </div>
</body>
</html>
