<!DOCTYPE html>
<html class="dark" lang="uz">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nexus Gate | Identity Authorization</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0ea5e9",
                        "secondary": "#2dd4bf",
                        "background": "#020617",
                        "surface": "#0f172a",
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; }
        .glass-gate {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nexus-grid {
            background-image: linear-gradient(rgba(14, 165, 233, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }
        .input-nexus {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-nexus:focus {
            background: rgba(14, 165, 233, 0.05); border-color: #0ea5e9; box-shadow: 0 0 30px rgba(14, 165, 233, 0.1);
        }
        @keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
        .scan-line { width: 100%; height: 100px; background: linear-gradient(180deg, transparent, rgba(14, 165, 233, 0.1), transparent); animation: scan 6s linear infinite; }
    </style>
</head>
<body class="bg-background text-slate-100 min-h-screen overflow-y-auto flex items-center justify-center p-4 sm:p-6 md:p-8">
    <div class="fixed inset-0 nexus-grid pointer-events-none z-0"></div>
    <div class="w-full max-w-lg glass-gate rounded-[2rem] md:rounded-[3rem] p-6 sm:p-8 md:p-12 lg:p-16 space-y-8 md:space-y-12 relative z-10 shrink-0">
        <!-- Mobile Logo (visible only on small screens) -->
        <div class="flex items-center justify-center mb-6 md:mb-8">
            {% url "landing" as landing_url %}
            <a href="{{ landing_url }}" class="flex flex-col items-center gap-4 group">
                <div class="w-14 h-14 md:w-16 md:h-16 bg-gradient-to-tr from-primary to-secondary rounded-2xl flex items-center justify-center shadow-xl shadow-primary/20 group-hover:rotate-[360deg] transition-transform duration-1000">
                    <span class="material-icons-round text-white text-2xl md:text-3xl">terminal</span>
                </div>
                <div class="flex flex-col items-center text-center">
                    <span class="text-xl md:text-2xl font-black tracking-tighter text-white uppercase italic leading-none">Ozodbek.web</span>
                    <span class="text-[8px] md:text-[10px] font-black text-primary/60 tracking-[0.4em] uppercase mt-2">Quantum Identity</span>
                </div>
            </a>
        </div>
        
        <div class="space-y-2 md:space-y-4 text-center">
            <h2 class="text-2xl sm:text-3xl md:text-4xl font-black text-white tracking-tighter italic leading-tight">Identity Authorization</h2>
            <p class="text-[10px] md:text-xs font-medium text-slate-400 uppercase tracking-widest leading-relaxed">Tizimga kirish uchun ruxsat bering</p>
        </div>

        {% if messages %}
        <div class="space-y-4">
            {% for message in messages %}
            <div class="p-4 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold text-center italic">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form action="{% url 'login' %}" method="POST" class="space-y-6 md:space-y-8">
            {% csrf_token %}
            <div class="space-y-4 md:space-y-6">
                <div class="space-y-2 md:space-y-3">
                    <label class="font-mono text-[8px] md:text-[9px] font-black text-slate-500 uppercase tracking-[0.2em] md:tracking-[0.3em]">User Identity Handle</label>
                    <input class="w-full input-nexus px-4 py-3 md:px-6 md:py-5 rounded-xl md:rounded-2xl outline-none text-white text-xs md:text-sm font-bold placeholder:text-slate-700" type="text" name="username" placeholder="Foydalanuvchi nomi" required/>
                </div>
                <div class="space-y-2 md:space-y-3">
                    <label class="font-mono text-[8px] md:text-[9px] font-black text-slate-500 uppercase tracking-[0.2em] md:tracking-[0.3em]">Security Token</label>
                    <input class="w-full input-nexus px-4 py-3 md:px-6 md:py-5 rounded-xl md:rounded-2xl outline-none text-white text-xs md:text-sm font-bold placeholder:text-slate-700" type="password" name="password" placeholder="Parol" required/>
                </div>
            </div>

            <button type="submit" class="w-full py-4 md:py-6 bg-primary text-white rounded-xl md:rounded-[1.5rem] font-black uppercase tracking-[0.2em] md:tracking-[0.3em] text-[10px] md:text-xs hover:scale-105 active:scale-95 transition-all shadow-2xl shadow-primary/30 italic relative overflow-hidden group">
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                <span class="relative z-10">Authorize Session</span>
            </button>
        </form>

        <p class="text-center">
            <a href="{% url 'forgot_password' %}" class="text-[8px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest hover:text-primary transition-colors">
                Parolni unutdingizmi?
            </a>
        </p>

        <p class="text-center pt-2 md:pt-0">
            <span class="text-[8px] md:text-[10px] font-bold text-slate-500 uppercase tracking-widest">Identiyingiz yo'qmi?</span>
            <a href="{% url 'register' %}" class="text-[8px] md:text-[10px] font-black text-primary uppercase tracking-widest ml-1 md:ml-2 hover:underline italic">Initialize New</a>
        </p>
    </div>
</body>
</html>
